{# Fallback: the user pastes the vacancy text; the server finds the salary and keeps the rest as description. #}
{% from "macros.html" import csrf with context %}
<form method="post" action="/applications/parse-text" hx-post="/applications/parse-text"
      hx-target="#new-form" hx-disabled-elt="#new-form button">
  {{ csrf() }}
  {% if message %}<p class="flash flash-warning" role="status">{{ message }}</p>{% endif %}
  <h3>{{ t("paste_text_title") }}</h3>
  <label>
    {{ t("f_url") }}
    <input type="url" name="url" value="{{ url }}" placeholder="https://">
  </label>
  <label>
    {{ t("paste_text_title") }}
    <textarea name="text" rows="10" required placeholder="{{ t('paste_text_hint') }}"></textarea>
    <small>{{ t("paste_text_hint") }}</small>
  </label>
  <div class="form-actions">
    <button type="submit">{{ t("paste_text_submit") }}</button>
    <button type="button" class="secondary outline" onclick="document.getElementById('new-form').innerHTML = ''">{{ t("cancel") }}</button>
  </div>
</form>
