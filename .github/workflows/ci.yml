name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtrack" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://jobtrack:jobtrack@localhost:5432/jobtrack_test' || '' }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test it against PostgreSQL
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 2; done
          curl -fs localhost:8000/healthz
          curl -fs -o /dev/null localhost:8000/login
          docker compose logs app | tail -20
          docker compose down -v
